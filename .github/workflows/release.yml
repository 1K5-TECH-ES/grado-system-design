# Publicación: al subir una etiqueta vX.Y.Z publica los tres paquetes con esa versión.
# Configura en el repositorio (Settings → Secrets and variables → Actions):
#   - variable NPM_REGISTRY_URL: el registro privado (p. ej. https://npm.pkg.github.com
#     si el ámbito de los paquetes coincide con la organización, o el de vuestro Artifactory/Verdaccio).
#   - secreto NPM_TOKEN: un token con permiso de publicación en ese registro.
# La versión de los package.json tiene que coincidir con la etiqueta: `npm run release:check` lo comprueba.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: ${{ vars.NPM_REGISTRY_URL }}
      - run: npm ci
      - run: npm run release:check -- "${GITHUB_REF_NAME#v}"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm publish --workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run docs:build
      - name: Release en GitHub con los paquetes y las notas del CHANGELOG
        run: |
          node scripts/release.mjs notes "${GITHUB_REF_NAME#v}" > notas.md
          gh release create "$GITHUB_REF_NAME" docs-site/dist/downloads/*.tgz --title "Grado $GITHUB_REF_NAME" --notes-file notas.md
        env:
          GH_TOKEN: ${{ github.token }}
