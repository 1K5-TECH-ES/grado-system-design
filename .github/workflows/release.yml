# Publicación: al subir una etiqueta vX.Y.Z publica los tres paquetes en GitHub Packages
# (ámbito @1k5-tech-es, privados como el repositorio) y crea la release de GitHub.
# No necesita secretos: publica con el GITHUB_TOKEN del propio workflow.
# La versión de los package.json tiene que coincidir con la etiqueta: `npm run release:check` lo comprueba.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@1k5-tech-es'
      - run: npm ci
      - run: npm run release:check -- "${GITHUB_REF_NAME#v}"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # La web y los .tgz se generan antes de publicar: si algo falla, no se publica nada a medias.
      - run: npm run docs:build
      - run: npm publish --workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release en GitHub con los paquetes y las notas del CHANGELOG
        run: |
          node scripts/release.mjs notes "${GITHUB_REF_NAME#v}" > notas.md
          gh release create "$GITHUB_REF_NAME" docs-site/dist/downloads/*.tgz --title "Grado $GITHUB_REF_NAME" --notes-file notas.md
        env:
          GH_TOKEN: ${{ github.token }}
