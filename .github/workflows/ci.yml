# Integración continua: lo mismo que `npm run test:all`, repartido en cuatro trabajos.
# - checks: lint, tests unitarios y de paridad, API pública, tamaño, navegador (teclado, foco y axe) y web.
# - compat: tests y navegador con React 18, Vue 3.5.0 y Node 24, los mínimos y la otra LTS.
# - smoke: apps de prueba con Vite, Next y Nuxt que instalan los .tgz y compilan (test/smoke/).
# - visual: una captura por componente y las del armazón, dentro de la imagen oficial de
#   Playwright, para que el renderizado sea siempre el mismo. Para regenerarlas en local con esa
#   imagen: npm run test:visual:docker -- --update-snapshots. También se puede lanzar el workflow
#   a mano con «update-snapshots» y descargar el artefacto «capturas» en test/visual/__screenshots__/.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerar las capturas de regresión visual
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # La API pública (api/*.api.md) y el tamaño de los paquetes no cambian sin querer.
      - run: npm run api:check
      - run: npm run size
      # Si diseño ha subido design/figma-tokens.json (export de Tokens Studio), tiene que coincidir.
      - run: npm run figma:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run docs:build
      - run: npm run docs:check
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: docs-site/dist/
          retention-days: 7

  # Compatibilidad: lo que prometen peerDependencies y engines, probado en el CI.
  # React 18.3 y Vue 3.5.0 son los mínimos: se instalan encima del lockfile sin guardarlos.
  # Node 22 ya lo prueba «checks»; aquí va también la otra LTS.
  compat:
    name: compat · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: React 18
            node: 22
            install: react@18.3.1 react-dom@18.3.1
          - name: Vue 3.5.0
            node: 22
            install: vue@3.5.0
          - name: Node 24
            node: 24
            install: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: ${{ matrix.install != '' }}
        run: npm install --no-save ${{ matrix.install }}
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # Apps de prueba: Vite + React, Next (App Router) y Nuxt instalan los .tgz y compilan.
  # Node 24: el npm 10 de Node 22 no sabe instalar Nuxt 4.6 («reading 'edgesOut'»), con o sin Grado.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:smoke

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La web (una captura por componente sale de /componentes) y el catálogo (el armazón).
      - run: npm run build && node scripts/docs.mjs && node scripts/catalog.mjs
      - name: Capturas
        run: npx playwright test ${{ inputs.update-snapshots && '--update-snapshots' || '' }}
        env:
          HOME: /root
      - if: ${{ inputs.update-snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: test/visual/__screenshots__/
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: diferencias
          path: test-results/
          retention-days: 7
